<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>
    
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 46px; fill: #ffffff; }
    .subtitle { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 20px; fill: #cbd5e1; }
    .badge-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; fill: #a78bfa; }
    
    /* Dynamic background wave animation */
    @keyframes floatWave {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-15px) rotate(1deg); }
      100% { transform: translateY(0px) rotate(0deg); }
    }
    
    @keyframes pulseGlow {
      0% { opacity: 0.3; }
      50% { opacity: 0.7; }
      100% { opacity: 0.3; }
    }

    @keyframes dashMove {
      0% { stroke-dashoffset: 100; }
      100% { stroke-dashoffset: 0; }
    }

    .wave1 { animation: floatWave 8s ease-in-out infinite; transform-origin: center; }
    .wave2 { animation: floatWave 12s ease-in-out infinite reverse; transform-origin: center; }
    .glow-circle { animation: pulseGlow 4s ease-in-out infinite; }
    .animated-line { stroke-dasharray: 10 15; animation: dashMove 20s linear infinite; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="300" fill="url(#bg)" rx="16" />

  <!-- Dynamic / Animated Background Graphics (Behind text) -->
  <g opacity="0.4" class="wave1">
    <circle cx="150" cy="80" r="180" fill="#4f46e5" class="glow-circle" filter="url(#glow)" />
    <circle cx="1050" cy="220" r="200" fill="#9333ea" class="glow-circle" filter="url(#glow)" />
  </g>

  <!-- Flow & Network Decorative Lines (Background) -->
  <path class="animated-line" d="M -50 220 Q 300 100 600 240 T 1250 150" fill="none" stroke="#6366f1" stroke-width="2" opacity="0.3" />
  <path class="animated-line" d="M -50 80 Q 400 280 800 100 T 1250 220" fill="none" stroke="#ec4899" stroke-width="1.5" opacity="0.25" />

  <!-- Background Decorative Grid Cards (Positioned safely to sides/back) -->
  <g transform="translate(900, 40)" opacity="0.5" class="wave2">
    <rect width="240" height="100" rx="12" fill="url(#cardBg)" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1" />
    <path d="M 20 70 L 60 40 L 100 55 L 140 25 L 180 45 L 220 20" fill="none" stroke="#c084fc" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="220" cy="20" r="4" fill="#f472b6" />
  </g>

  <g transform="translate(60, 160)" opacity="0.4" class="wave1">
    <rect width="200" height="90" rx="12" fill="url(#cardBg)" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1" />
    <rect x="20" y="25" width="70" height="8" rx="4" fill="#818cf8" />
    <rect x="20" y="45" width="120" height="6" rx="3" fill="#cbd5e1" opacity="0.6" />
    <rect x="20" y="60" width="90" height="6" rx="3" fill="#cbd5e1" opacity="0.4" />
  </g>

  <!-- Foreground Content Block (Clear & Legible Title/Subtitle) -->
  <g transform="translate(0, 0)">
    <!-- Pill Badge -->
    <g transform="translate(450, 42)">
      <rect width="300" height="32" rx="16" fill="#1e1b4b" stroke="#818cf8" stroke-opacity="0.4" stroke-width="1" />
      <text x="150" y="21" text-anchor="middle" class="badge-text">⚡ CURATED CLM ECOSYSTEM ⚡</text>
    </g>

    <!-- Main Title with Gradient Accent -->
    <text x="600" y="125" text-anchor="middle" class="title">
      Awesome Contract Lifecycle Management
    </text>
    
    <!-- Gradient Line Divider -->
    <rect x="350" y="145" width="500" height="4" rx="2" fill="url(#accent)" />

    <!-- Subtitle -->
    <text x="600" y="195" text-anchor="middle" class="subtitle">
      Top SaaS Platforms &amp; Open-Source Projects for Contract Drafting, AI &amp; E-Signatures
    </text>

    <!-- Subtitle Tagline -->
    <text x="600" y="235" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="#94a3b8" font-weight="400">
      Enterprise CLM • Open-Source Alternatives • AI Contract Analytics • Obligation Tracking
    </text>
  </g>
</svg>
